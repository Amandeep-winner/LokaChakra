[project]
name = "lokachakra"
version = "1.0.0"
description = "Bi-Temporal Personal Relationship & OSINT Intelligence Graph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.17",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "graphiti-core>=0.31.2",
    "neo4j>=5.26.0",
    "instructor>=1.7.0",
    "openai>=1.55.0",
    "groq>=0.13.0",
    "faster-whisper>=1.1.0",
    "splink>=4.0.6",
    "duckdb>=1.1.0",
    "rapidfuzz>=3.10.0",
    "fastembed>=0.4.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "alembic>=1.14.0",
    "taskiq>=0.11.9",
    "taskiq-redis>=1.0.2",
    "redis>=5.2.0",
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0.6",
    "psycopg[binary,pool]>=3.2.3",
    "aiogram>=3.15.0",
    "httpx>=0.28.0",
    "playwright>=1.49.0",
    "apscheduler>=3.10.4",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "testcontainers>=4.8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
